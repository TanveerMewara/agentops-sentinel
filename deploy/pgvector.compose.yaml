services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: ${SENTINEL_POSTGRES_PASSWORD:?Set a PostgreSQL password}
      POSTGRES_DB: sentinel
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - sentinel_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_admin -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  sentinel_pgvector_data:
